<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <g fill="#f4f4f4" stroke="#222" stroke-width="1.6">
    <rect x="24" y="36" width="236" height="76" rx="8"/>
    <rect x="340" y="36" width="236" height="76" rx="8"/>
    <rect x="656" y="36" width="264" height="76" rx="8"/>
    <rect x="1000" y="36" width="176" height="76" rx="8"/>
    <rect x="24" y="188" width="272" height="90" rx="8"/>
    <rect x="344" y="188" width="280" height="90" rx="8"/>
    <rect x="664" y="188" width="392" height="90" rx="8"/>
    <rect x="24" y="352" width="560" height="100" rx="8"/>
  </g>
  <g fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="260" y1="74" x2="336" y2="74"/>
    <line x1="576" y1="74" x2="652" y2="74"/>
    <line x1="920" y1="74" x2="996" y2="74"/>
    <path d="M 1088 112 V 152 H 484 V 184"/>
    <line x1="296" y1="233" x2="340" y2="233"/>
    <line x1="624" y1="233" x2="660" y2="233"/>
    <path d="M 860 278 V 300 H 140 V 282"/>
    <line x1="200" y1="278" x2="200" y2="348"/>
  </g>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" text-anchor="middle">
    <text x="142" y="64" font-size="15" font-weight="600" fill="#111">公开内容变化 · Public changes</text>
    <text x="142" y="86" font-size="12" fill="#333">提交 · 终审留下或撤销 · submit/keep/revoke</text>
    <text x="142" y="103" font-size="12" fill="#333">点星 · 管理员撤下 · star/remove</text>

    <text x="458" y="64" font-size="15" font-weight="600" fill="#111">Backend 组装 · builds snapshot</text>
    <text x="458" y="86" font-size="12" fill="#333">公开的 post、fastpost · public posts</text>
    <text x="458" y="103" font-size="12" fill="#333">商品不进快照 · no store items</text>

    <text x="788" y="64" font-size="15" font-weight="600" fill="#111">board 目录 · board directory</text>
    <text x="788" y="86" font-size="12" fill="#333">discover.json</text>
    <text x="788" y="103" font-size="12" fill="#333">图片用原地址 · images use original URLs</text>

    <text x="1088" y="64" font-size="15" font-weight="600" fill="#111">中枢取回 · Hub fetch</text>
    <text x="1088" y="86" font-size="12" fill="#333">取回并落盘 · fetch then write</text>
    <text x="1088" y="103" font-size="12" fill="#333">entry disk</text>

    <text x="300" y="64" font-size="12" fill="#333">变化 · Changes</text>
    <text x="616" y="64" font-size="12" fill="#333">写入 · Write</text>
    <text x="960" y="64" font-size="12" fill="#333">取回 · Fetch</text>
    <text x="726" y="146" font-size="12" fill="#333">取回 · Pull</text>

    <text x="318" y="223" font-size="12" fill="#333">读 · Read</text>
    <text x="642" y="214" font-size="12" fill="#333">没有快照时</text>
    <text x="642" y="228" font-size="12" fill="#333">no snapshot</text>
    <text x="500" y="294" font-size="12" fill="#333">实时结果 · Live results</text>
    <text x="232" y="330" font-size="12" fill="#333">有会话时 · with a session</text>

    <text x="160" y="218" font-size="15" font-weight="600" fill="#111">/discover 浏览器 · browser</text>
    <text x="160" y="242" font-size="12" fill="#333">未登录也读这份快照 · reads snapshot logged out</text>
    <text x="160" y="262" font-size="12" fill="#333">同源读 /discover.json · same-origin read</text>

    <text x="484" y="218" font-size="15" font-weight="600" fill="#111">入口 nginx · Entry nginx</text>
    <text x="484" y="242" font-size="12" fill="#333">有快照就给这一份 · serves it when present</text>
    <text x="484" y="262" font-size="12" fill="#333">/var/www/&lt;id&gt;/discover.json</text>

    <text x="860" y="218" font-size="15" font-weight="600" fill="#111">回落：经隧道到 Backend · fallback via tunnel</text>
    <text x="860" y="242" font-size="12" fill="#333">GET /api/web/information</text>
    <text x="860" y="262" font-size="12" fill="#333">GET /api/web/store</text>

    <text x="304" y="386" font-size="15" font-weight="600" fill="#111">登录后叠加当前账户的状态 · overlay account state after login</text>
    <text x="304" y="408" font-size="12" fill="#333">POST /api/web/discover-self</text>
    <text x="304" y="426" font-size="12" fill="#333">关掉的 · 星 · 好友 · 已下载 · 自己发的 · 已授予的音频</text>
    <text x="304" y="442" font-size="12" fill="#333">dismissed, stars, friends, downloaded, own posts, granted audio</text>
  </g>
</svg>
