<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="704" viewBox="0 0 1200 704">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#222"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>

  <rect x="280" y="90" width="640" height="180" rx="14" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
  <g fill="#f4f4f4" stroke="#222" stroke-width="1.4">
    <rect x="302" y="150" width="190" height="62" rx="8"/>
    <rect x="505" y="150" width="190" height="62" rx="8"/>
    <rect x="708" y="150" width="190" height="62" rx="8"/>
  </g>

  <rect x="60" y="400" width="340" height="150" rx="14" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
  <rect x="430" y="400" width="340" height="150" rx="14" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
  <rect x="800" y="400" width="340" height="150" rx="14" fill="#ffffff" stroke="#222" stroke-width="1.6"/>

  <g fill="none" stroke="#222" stroke-width="1.6">
    <line x1="600" y1="270" x2="600" y2="330"/>
    <line x1="230" y1="330" x2="970" y2="330"/>
    <line x1="230" y1="330" x2="230" y2="396" marker-end="url(#arrow)"/>
    <line x1="600" y1="330" x2="600" y2="396" marker-end="url(#arrow)"/>
    <line x1="970" y1="330" x2="970" y2="396" marker-end="url(#arrow)"/>
    <!-- 委托发信：唯一由实例发起的调用，方向相反。 -->
    <line x1="830" y1="396" x2="830" y2="332" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  </g>
  <rect x="330" y="307" width="540" height="22" fill="#ffffff"/>

  <rect x="60" y="580" width="340" height="76" rx="10" fill="#ffffff" stroke="#222" stroke-width="1.4"/>
  <rect x="430" y="580" width="340" height="76" rx="10" fill="#ffffff" stroke="#222" stroke-width="1.4"/>
  <rect x="800" y="580" width="340" height="76" rx="10" fill="#ffffff" stroke="#222" stroke-width="1.4"/>

  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" text-anchor="middle">
    <text x="600" y="120" font-size="17" font-weight="600" fill="#111">xknot.si 中枢 · Hub</text>
    <text x="397" y="172" font-size="14" font-weight="600" fill="#111">门户 · Portal</text>
    <text x="397" y="190" font-size="12" fill="#333">档案 · 状态 · 区域</text>
    <text x="397" y="206" font-size="12" fill="#333">profile · status · region</text>
    <text x="600" y="172" font-size="14" font-weight="600" fill="#111">健康探测 · Health probe</text>
    <text x="600" y="190" font-size="12" fill="#333">每 15 分钟</text>
    <text x="600" y="206" font-size="12" fill="#333">every 15 min</text>
    <text x="803" y="172" font-size="14" font-weight="600" fill="#111">申请与收录 · Apply &amp; list</text>
    <text x="803" y="190" font-size="12" fill="#333">提交即通过后写清单</text>
    <text x="803" y="206" font-size="12" fill="#333">listed on approval</text>
    <text x="600" y="238" font-size="13" fill="#333">只读三层信息 · 写入只有加入申请与委托发信</text>
    <text x="600" y="256" font-size="13" fill="#333">read-only three layers · writes only join application and relayed mail</text>

    <text x="230" y="434" font-size="15" font-weight="600" fill="#111">Knot 旗舰 · Knot flagship</text>
    <text x="230" y="460" font-size="12" fill="#333">&lt;标签&gt;.xknot.si</text>
    <text x="230" y="484" font-size="12" fill="#333">knot-platform 完整部署 · full knot-platform deployment</text>
    <text x="230" y="508" font-size="11" fill="#555">Postgres · 上传 · 账号 · 积分 · uploads · accounts · points</text>

    <text x="600" y="434" font-size="15" font-weight="600" fill="#111">travel.xknot.si</text>
    <text x="600" y="460" font-size="12" fill="#333">OPC 伙伴运营 · OPC partner-operated</text>
    <text x="600" y="484" font-size="12" fill="#333">自有 Postgres · own Postgres</text>
    <text x="600" y="508" font-size="11" fill="#555">自己的账号 · 积分 · 审核 · own accounts · points · review</text>

    <text x="970" y="434" font-size="15" font-weight="600" fill="#111">ai.xknot.si</text>
    <text x="970" y="460" font-size="12" fill="#333">OPC 伙伴运营 · OPC partner-operated</text>
    <text x="970" y="484" font-size="12" fill="#333">自有 Postgres · own Postgres</text>
    <text x="970" y="508" font-size="11" fill="#555">自己的账号 · 积分 · 审核 · own accounts · points · review</text>

    <text x="600" y="321" font-size="12" fill="#333">定时 GET：健康状态、活动数据、橱窗 URL　　点击一律回原站 · periodic GET: health, activity, showcase URL; clicks always return to origin</text>
    <text x="850" y="366" font-size="11" fill="#333" text-anchor="start">委托发信 · Relayed mail</text>
    <text x="850" y="382" font-size="10" fill="#555" text-anchor="start">纯文本 · 凭据 · 额度 · plain text · credentials · quota</text>

    <text x="230" y="606" font-size="14" font-weight="600" fill="#111">中枢不做 · Hub does not</text>
    <text x="230" y="628" font-size="12" fill="#333">不存内容 · 不参与运营 · 不代审核 · no content/ops/review</text>
    <text x="230" y="648" font-size="12" fill="#333">不做信息流 · 不保存发信正文 · no feed · keeps no mail body</text>

    <text x="600" y="606" font-size="14" font-weight="600" fill="#111">M1 · 门户 · Portal</text>
    <text x="600" y="628" font-size="12" fill="#333">站点简介 · 健康状态 · 加入申请 · intro · health · apply</text>
    <text x="600" y="648" font-size="12" fill="#333">实例清单是一个 JSON 文件 · the instance list is one JSON file</text>

    <text x="970" y="606" font-size="14" font-weight="600" fill="#111">M2 · 活动数据与橱窗 · Activity &amp; showcase</text>
    <text x="970" y="628" font-size="12" fill="#333">伙伴公开的计数 · 最多 6 张卡片 · partner counts · ≤6 cards</text>
    <text x="970" y="648" font-size="12" fill="#333">橱窗：伙伴给一个 URL，中枢拉取 · showcase: partner gives a URL</text>
  </g>

  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" text-anchor="start">
    <text x="40" y="34" font-size="20" font-weight="600" fill="#111">XKnot 联邦：中枢、实例、橱窗、委托发信 · XKnot Federation: hub, instances, showcase, relayed mail</text>
    <text x="40" y="58" font-size="13" fill="#555">中枢只读三层信息。写入只有加入申请与委托发信；清单与快照由中枢自己写。三语输出：en / zh-CN / zh-TW。</text>
    <text x="40" y="76" font-size="13" fill="#555">The hub reads three layers only. Writes are only join applications and relayed mail; the hub writes its own list and snapshot. Three locales: en / zh-CN / zh-TW.</text>
    <text x="40" y="664" font-size="12" fill="#666">每个实例的数据、账号、积分和审核都留在自己的库里。中枢只有一份清单、一份探测结果、伙伴发布的橱窗副本，以及不含正文的发信记录。</text>
    <text x="40" y="684" font-size="12" fill="#666">Each instance keeps its data, accounts, points and review in its own database. The hub holds only a list, probe results, partner showcase copies, and mail records without bodies.</text>
  </g>
</svg>
