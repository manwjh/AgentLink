# 入口在 Cloudflare 后面：还原真实客户端地址。
#
# 不还原的话，$remote_addr 永远是 CF 边缘节点的地址，渲染出来的 vhost 写出去的
# X-Real-IP 与 X-Forwarded-For 也就都是边缘地址；后端按 IP 做的限流、封禁、
# 审计会全部塌成「一个 CF 网段」，等于没有。
#
# 放在 http 级（conf.d/ 下一个独立文件），不像子域 vhost 那样每份写一遍：
# 同一台入口主机上所有子域都走同一个 CF 边缘，声明两遍反而会互相覆盖。
#
# 安装：这台入口主机上执行一次（人工维护，不由开通流程写）
#   sudo install -m 644 knot-realip.conf /etc/nginx/conf.d/knot-realip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 只信任 CF 自己的网段：入口主机若还能被直连，来自别处的 CF-Connecting-IP
# 不会被采信，伪造这个头也改不了 $remote_addr。
real_ip_header CF-Connecting-IP;

# 下面这份网段抄自 https://www.cloudflare.com/ips-v4 与 /ips-v6。
# CF 偶尔会加段；漏了只会让新段的客户端继续显示边缘地址，不影响可用性，
# 定期对一遍即可。段里写错（比如语法坏掉）会让 nginx -t 直接失败。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
