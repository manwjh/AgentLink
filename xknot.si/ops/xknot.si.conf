# xknot.si：中枢门户。
#
# 静态文件位于 /var/www/xknot，内容由 web/dist 同步而来（见 ops/deploy-hub.sh）。
# /api/ 与 /admin/ 反代到本机的接口进程（server/index.mjs，默认 127.0.0.1:5181），
# 接口只监听回环，不要给它开放公网端口。
#
# 当前：HTTPS 已启用（Let’s Encrypt）。80 仅 ACME + 301 到 https。
# 详见 ops/README-deploy-aws.md。
#
# 使用步骤：
#   1. 把 web/dist 同步到 /var/www/xknot。
#   2. 把本文件放到 /etc/nginx/conf.d/xknot.si.conf，nginx -t 后 reload。
#   3. 验证：curl -sI -H 'Host: xknot.si' https://xknot.si/
#   4. 接口进程用 systemd 常驻，环境变量见 docs/HUB.md 第 7.2 节。

# 申请与登录各一条限流；进程内还有一层按来源哈希的限流。
limit_req_zone $binary_remote_addr zone=xknot_apply:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=xknot_login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=xknot_relay:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name xknot.si www.xknot.si;

    location /.well-known/acme-challenge/ {
        root /var/www/xknot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xknot.si www.xknot.si;

    root /var/www/xknot;
    index index.html;
    charset utf-8;

    # 和实例子域写同一份 JSON 日志：聚合端靠 $host 分桶，门户自己也要一个桶
    # （hub.json）。落到 nginx.conf 的默认日志（main 格式，不记 $host）就分不出来，
    # 而聚合任务不会报错，只会少写一块数据。
    # 依赖入口的 /etc/nginx/conf.d/knot-log.conf 声明 log_format knot_json。
    access_log /var/log/nginx/knot-access.log knot_json;

    # 门户是纯静态：页面 2KB、主包 154KB。这里不开 gzip，主包就按原文发出去。
    # 只压文本类；图片与字体本来就压过了。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/xml text/xml text/markdown;

    ssl_certificate /etc/letsencrypt/live/xknot.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xknot.si/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # 根路径直接送这张跳转页（页面自己带 meta refresh 到 /en/），不用 302。
    # 两个原因：Search Console 验证网址前缀时抓的就是这一页，标签得真的送出去，
    # 不能指望抓取器先跟一次跳转再去找；另外有一层 302 时这张页面等于从不被使用。
    # 不加长缓存：换验证令牌后要立刻能看到新的。
    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location /assets/ {
        # 文件名带哈希，长缓存。不要在这里写 add_header，否则会覆盖上面的安全头。
        expires 1y;
    }

    location = /data/hub.json {
        default_type application/json;
        # expires -1 等价于 Cache-Control: no-cache，同时保留 server 级安全头。
        expires -1;
    }

    # Agent 指引（仓库根 docs/KNOT_HELP.md，构建时产出两份）。协议文档对所有实例通用，
    # 所以不再由每个实例的 Backend 渲染；代理和人都读这里，省掉一次穿隧道。
    #   /knot-help     排版好的单页，给浏览器
    #   /knot-help.md  原文，给 Agent
    # 文档会随协议改，缓存只留 5 分钟。
    location = /knot-help {
        try_files /knot-help.html =404;
        expires 5m;
    }

    location = /knot-help.md {
        default_type text/markdown;
        expires 5m;
    }

    location ~* \.html$ {
        expires -1;
    }

    location /en/ {
        try_files $uri $uri/ =404;
    }

    location /zh-CN/ {
        try_files $uri $uri/ =404;
    }

    location /zh-TW/ {
        try_files $uri $uri/ =404;
    }

    # 委托发信：实例服务端调用，只认 Bearer。等待 SMTP 可能超过 15 秒，
    # 单独给这条路径更长的读超时；其余 /api/ 仍用默认值。
    location = /api/federation/mail {
        limit_req zone=xknot_relay burst=6 nodelay;
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    # 伙伴页面：申请案例页、一次性领取页。邮箱验证的 /verify/ 已随自动通过下线。
    # 链接本身就是能力凭据（持有即可操作），不能写进访问日志，也不能被缓存。
    location ~ ^/(case|claim)/ {
        access_log off;
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
        proxy_read_timeout 20s;
    }

    # 这些写操作消费令牌或校验归属，同样不留访问日志。
    location ~ ^/api/(verify|claim)$ {
        access_log off;
        limit_req zone=xknot_apply burst=5 nodelay;
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
        proxy_read_timeout 20s;
    }

    location ~ ^/api/case/ {
        access_log off;
        limit_req zone=xknot_apply burst=5 nodelay;
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
        proxy_read_timeout 20s;
    }

    # 加入申请与控制台：反代到本机接口进程。
    location /api/ {
        limit_req zone=xknot_apply burst=5 nodelay;
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
        proxy_read_timeout 15s;
    }

    # 登录接口单独限流；/api/ 的前缀匹配会被更长的前缀覆盖。
    location /api/admin/login {
        limit_req zone=xknot_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 本 location 有自己的 add_header，nginx 不再继承 server 级头；
        # nosniff / Referrer-Policy / X-Frame-Options / CSP 由接口的 serveAdminFile 发出，
        # 这里只补接口没有的 HSTS，避免两份 CSP 叠加。
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
