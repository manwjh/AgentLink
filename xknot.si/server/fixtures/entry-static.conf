# travel-sg.xknot.si：入口 conf，由 auto-connect 生成，请勿手改。
# 静态页落在 /var/www/travel-sg；/api 经本机回环端口 18091 回到实例（SSH 反向隧道）。

upstream knot_entry_18091 {
    server 127.0.0.1:18091;
    keepalive 16;
    keepalive_timeout 4s;
}
# 访问日志格式（每个子域一份，名字唯一）。聚合端：ops/traffic.mjs。
log_format knot_json_travel_sg_xknot_si escape=json
  '{"at":"$time_iso8601","host":"$host","status":$status,"method":"$request_method",'
  '"uri":"$uri","bytes":$body_bytes_sent,"requestTime":$request_time,'
  '"upstreamTime":"$upstream_response_time","cache":"$upstream_cache_status",'
  '"ip":"$remote_addr","ua":"$http_user_agent","ref":"$http_referer"}';


server {
    listen 80;
    listen [::]:80;
    server_name travel-sg.xknot.si;

    location /.well-known/acme-challenge/ {
        root /var/www/travel-sg;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name travel-sg.xknot.si;

    ssl_certificate /etc/letsencrypt/live/travel-sg.xknot.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travel-sg.xknot.si/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 每个子域一行，格式名就是上面那份唯一声明。
    # 少了这一行，控制台里这个节点的「入口流量」永远是「未采集」。
    access_log /var/log/nginx/knot-access.log knot_json_travel_sg_xknot_si;

    client_max_body_size 52m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/xml text/xml;

    location /.well-known/acme-challenge/ {
        root /var/www/travel-sg;
    }

    # 管理面只在实例自己的机器与内网开：整站反代之后，隧道的对端是实例上的回环，
    # Backend 分不出「本机来的」和「经隧道从公网来的」，所以必须在入口先挡住。
    location ^~ /api/admin {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    location ^~ /admin {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    # 普通接口的请求体都很小，先收完再回源；不把请求体边收边转，避免一个慢上传
    # 让 120 秒的读超时在请求体还没传完时就到期（上传端点已在上面的 location 放宽）。
    location /api/ {
        proxy_pass http://knot_entry_18091;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /index.html {
        root /var/www/travel-sg;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        root /var/www/travel-sg;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
