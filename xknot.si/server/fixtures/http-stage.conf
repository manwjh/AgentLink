# cpswang.xknot.si：签发阶段的 HTTP 入口，由 auto-connect 生成，请勿手改。
# 证书签发成功后会被同一份生成器改写成 443 + /api 反代的完整版本。

server {
    listen 80;
    listen [::]:80;
    server_name cpswang.xknot.si;

    location /.well-known/acme-challenge/ {
        root /var/www/cpswang;
    }

    location / {
        root /var/www/cpswang;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
