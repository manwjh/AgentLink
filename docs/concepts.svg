<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" role="img" aria-label="XKnot roles and ownership">
  <rect width="980" height="660" fill="#FFFFFF"/>

  <defs>
    <style>text { font-family: 'PingFang SC', 'Hiragino Sans GB', system-ui, -apple-system, sans-serif; }</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65676B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0866FF"/>
    </marker>
  </defs>

  <rect x="330" y="100" width="400" height="130" rx="10" fill="#F0F6FF" stroke="#0866FF" stroke-width="1.5"/>
  <rect x="330" y="270" width="400" height="130" rx="10" fill="#FFFFFF" stroke="#D8DADF" stroke-width="1.5"/>
  <rect x="330" y="440" width="400" height="130" rx="10" fill="#F7F8FA" stroke="#D8DADF" stroke-width="1.5"/>
  <rect x="40" y="285" width="150" height="100" rx="10" fill="#FFFFFF" stroke="#D8DADF" stroke-width="1.5"/>

  <polyline points="115,285 115,165 326,165" fill="none" stroke="#65676B" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="190" y1="335" x2="326" y2="335" stroke="#65676B" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="530" y1="400" x2="530" y2="436" stroke="#65676B" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polyline points="730,505 770,505 770,165 734,165" fill="none" stroke="#0866FF" stroke-width="1.3" stroke-dasharray="5 4" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>

  <!-- TITLE -->
  <text x="490" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#050505">XKnot 的角色与归属</text>
  <text x="490" y="72" text-anchor="middle" font-size="13" fill="#65676B">XKnot 是网络 · xknot.si 是中枢 · knot-platform 是部署一套实例所用的软件</text>

  <!-- HUB -->
  <text x="350" y="132" font-size="16" font-weight="700" fill="#0866FF">中枢（xknot.si）</text>
  <text x="350" y="154" font-size="12" fill="#65676B">跑在中枢主机上 · 只读</text>
  <text x="350" y="180" font-size="13" fill="#050505">实例清单 instances.json · 门户与热点</text>
  <text x="350" y="202" font-size="13" fill="#050505">健康探测 · 受托代发实例的出站邮件</text>
  <text x="350" y="224" font-size="11.5" fill="#65676B">归属 xknot.si/ops/</text>

  <!-- ENTRY -->
  <text x="350" y="302" font-size="16" font-weight="700" fill="#050505">公网入口</text>
  <text x="350" y="324" font-size="12" fill="#65676B">跑在入口主机上 · nginx + 证书</text>
  <text x="350" y="350" font-size="13" fill="#050505">TLS 证书 · 占位页 · 整站反代</text>
  <text x="350" y="372" font-size="13" fill="#050505">conf 由开通进程渲染并安装</text>
  <text x="350" y="394" font-size="11.5" fill="#65676B">归属 xknot.si/server/provision.mjs</text>

  <!-- INSTANCE -->
  <text x="350" y="472" font-size="16" font-weight="700" fill="#050505">实例</text>
  <text x="350" y="494" font-size="12" fill="#65676B">跑在实例主机上 · 伙伴自己运营</text>
  <text x="350" y="520" font-size="13" fill="#050505">Backend · PostgreSQL · 上传 · 积分 · 审核</text>
  <text x="350" y="542" font-size="13" fill="#050505">配置 sites/&lt;站点&gt;/site.env</text>
  <text x="350" y="564" font-size="11.5" fill="#65676B">归属 knot-platform/sites/&lt;站点&gt;/</text>

  <!-- BROWSER -->
  <text x="115" y="325" text-anchor="middle" font-size="15" font-weight="600" fill="#050505">浏览器 / Agent</text>
  <text x="115" y="348" text-anchor="middle" font-size="11.5" fill="#65676B">看门户与实例</text>

  <!-- LABELS -->
  <text x="235" y="155" text-anchor="middle" font-size="10.5" fill="#65676B">读清单与门户</text>
  <text x="258" y="325" text-anchor="middle" font-size="10" fill="#65676B">https://&lt;标签&gt;.xknot.si</text>
  <text x="540" y="422" font-size="10.5" fill="#65676B">/api 经回源隧道</text>
  <text x="782" y="320" font-size="10.5" fill="#65676B">健康探测 中枢 → 实例</text>
  <text x="782" y="340" font-size="10.5" fill="#65676B">委托发信 实例 → 中枢</text>

  <!-- NOTES -->
  <text x="40" y="604" font-size="12" fill="#65676B">角色是职责，机器是硬件：当前部署里中枢主机与入口主机是同一台机器。</text>
  <text x="40" y="626" font-size="12" fill="#65676B">实例有固定公网 IP 时，公网入口与回源隧道都不存在，实例自己跑 nginx。</text>

</svg>
